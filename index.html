<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮件加密系统 · Mail Encryption System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem;
        }
        .container {
            max-width: 1200px; width: 100%; background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px); border-radius: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255,255,255,0.7);
            padding: 2.5rem; border: 1px solid rgba(255,255,255,0.6); position: relative;
        }
        .lang-switch {
            position: absolute; top: 1.5rem; right: 2rem; display: flex; gap: 0.5rem;
            background: #ffffffd9; padding: 0.3rem; border-radius: 2.5rem; border: 1px solid #cbdae9;
        }
        .lang-btn {
            background: transparent; border: none; padding: 0.4rem 1.2rem; border-radius: 2rem;
            font-size: 0.9rem; font-weight: 500; cursor: pointer; color: #2c3e50; transition: all 0.2s;
        }
        .lang-btn.active { background: #1e4a7a; color: white; }
        .lang-btn:hover:not(.active) { background: #eef3f9; }
        h1 {
            font-size: 2.4rem; font-weight: 600; color: #0b1e33; display: flex;
            align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; padding-right: 8rem;
        }
        h1 svg { width: 2.4rem; height: 2.4rem; stroke: #1e4a7a; stroke-width: 1.8; fill: none; flex-shrink: 0; }
        .subhead {
            font-size: 1rem; color: #2c3e50c0; margin-bottom: 2.2rem;
            border-left: 4px solid #1e4a7a; padding: 0.8rem 1.2rem;
            background: rgba(30, 74, 122, 0.04); border-radius: 0 12px 12px 0;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.8rem; }
        .card {
            background: #ffffffd9; border-radius: 2rem; padding: 1.8rem 1.6rem;
            box-shadow: 0 8px 20px -8px rgba(0, 20, 40, 0.2); border: 1px solid #ffffff;
            display: flex; flex-direction: column;
        }
        .card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.4rem; }
        .card-header svg { width: 1.8rem; height: 1.8rem; stroke: #1e4a7a; stroke-width: 1.8; fill: none; }
        .card-header h2 { font-size: 1.5rem; font-weight: 600; color: #122b44; }
        .field { margin-bottom: 1.3rem; display: flex; flex-direction: column; }
        .field label { font-size: 0.9rem; font-weight: 500; color: #1f3a57; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.4rem; }
        .badge { background: #eef3f9; border-radius: 40px; padding: 0.1rem 0.6rem; font-size: 0.7rem; color: #1e4a7a; border: 1px solid #bdd1e6; }
        input, textarea {
            width: 100%; padding: 0.9rem 1.1rem; font-family: monospace; font-size: 0.95rem;
            background: #fbfdff; border: 1px solid #cbdae9; border-radius: 1.3rem; outline: none; transition: 0.2s; color: #0b1e33;
        }
        input:focus, textarea:focus { border-color: #1e4a7a; box-shadow: 0 0 0 4px rgba(30, 74, 122, 0.15); background: #ffffff; }
        textarea { min-height: 110px; line-height: 1.5; resize: vertical; }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 3rem; }
        .toggle-password { position: absolute; right: 1rem; background: none; border: none; cursor: pointer; opacity: 0.6; }
        .toggle-password:hover { opacity: 1; }
        .toggle-password svg { width: 1.2rem; height: 1.2rem; stroke: #1e4a7a; fill: none; }
        .btn {
            background: #1e4a7a; color: white; border: none; border-radius: 2.5rem; padding: 0.9rem 1.5rem;
            font-weight: 600; font-size: 1rem; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 0.6rem; box-shadow: 0 8px 16px -6px #1e4a7a80; transition: all 0.2s ease;
        }
        .btn svg { width: 1.3rem; height: 1.3rem; stroke: currentColor; stroke-width: 2; fill: none; }
        .btn:hover { background: #133b60; transform: scale(1.02); }
        .btn-outline { background: transparent; color: #1e4a7a; border: 1.5px solid #1e4a7a70; box-shadow: none; }
        .btn-outline:hover { background: #1e4a7a10; border-color: #1e4a7a; }
        .message {
            margin-top: 1rem; padding: 0.8rem 1.2rem; border-radius: 2rem; font-size: 0.9rem;
            display: flex; align-items: center; gap: 0.7rem; background: #f0f6fe; color: #0b2b4a;
            border: 1px solid #b8d1e9; word-break: break-word;
        }
        .message.error { background: #ffeae9; color: #aa2e2e; border-color: #e6b3b3; }
        .message svg { flex-shrink: 0; width: 1.2rem; height: 1.2rem; stroke: currentColor; stroke-width: 2; fill: none; }
        .message .text { flex: 1; font-family: monospace; font-size: 0.85rem; }
        .divider { display: flex; align-items: center; gap: 1rem; margin: 1.2rem 0 0.6rem; color: #587a9e; font-size: 0.8rem; font-weight: 500; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #cbdae9, transparent); }
        .footer {
            margin-top: 2.5rem; text-align: center; font-size: 0.8rem; color: #6482a0;
            display: flex; justify-content: center; gap: 0.5rem; align-items: center; border-top: 1px dashed #b8cde0; padding-top: 1.5rem;
        }
        .footer svg { width: 1rem; height: 1rem; stroke: #6482a0; fill: none; }
        .transfer-wrapper { display: flex; justify-content: flex-end; margin-top: 1.2rem; }
        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.9rem; padding-right: 0; margin-top: 2.5rem; }
            .lang-switch { top: 1.2rem; right: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button class="lang-btn active" data-lang="zh" onclick="setLanguage('zh')">中文</button>
        <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
    </div>

    <h1>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="4" /><path d="M22 7L12 13L2 7" />
        </svg>
        <span id="titleText">邮件加密系统</span>
    </h1>
    <div class="subhead" id="subheadText">
        <strong>🔐 端到端本地加密</strong> — 使用 AES-256-GCM 算法，所有加解密均在浏览器中完成，密钥永不离开您的设备。
    </div>

    <div class="grid">
        <!-- 加密面板 -->
        <div class="card">
            <div class="card-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <h2 id="encryptCardTitle">加密邮件</h2>
            </div>
            <div class="field">
                <label id="labelPlainText">邮件正文 <span class="badge" id="badgePlain">明文</span></label>
                <textarea id="plainText" placeholder="输入需要加密的邮件内容…" rows="3"></textarea>
            </div>
            <div class="field">
                <label id="labelEncryptPassword">加密密钥 <span class="badge">AES-256</span></label>
                <div class="password-wrapper">
                    <input type="password" id="encryptPassword" placeholder="输入密钥 (不少于8个字符)" value="MySecretKey123!">
                    <button class="toggle-password" onclick="togglePassword('encryptPassword', this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
                    </button>
                </div>
            </div>
            <button class="btn" id="encryptBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2L15 9L22 9L16.5 13.5L19 21L12 16.5L5 21L7.5 13.5L2 9L9 9L12 2Z" /></svg>
                <span id="encryptBtnText">立即加密</span>
            </button>
            <div class="divider" id="dividerEncrypt">加密结果</div>
            <div class="field">
                <textarea id="cipherText" placeholder="加密后的密文将显示在这里…" rows="3" readonly></textarea>
            </div>
            <div class="message" id="encryptMessage">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
                <span class="text" id="encryptMessageText">等待加密… 输入正文和密钥后点击加密。</span>
            </div>
        </div>

        <!-- 解密面板 -->
        <div class="card">
            <div class="card-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" />
                </svg>
                <h2 id="decryptCardTitle">解密邮件</h2>
            </div>
            <div class="field">
                <label id="labelDecryptCipher">密文 <span class="badge">Base64 + GCM</span></label>
                <textarea id="decryptCipher" placeholder="粘贴需要解密的邮件密文…" rows="3"></textarea>
            </div>
            <div class="field">
                <label id="labelDecryptPassword">解密密钥 <span class="badge" id="badgeSameKey">同一密钥</span></label>
                <div class="password-wrapper">
                    <input type="password" id="decryptPassword" placeholder="输入加密时使用的密钥" value="MySecretKey123!">
                    <button class="toggle-password" onclick="togglePassword('decryptPassword', this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
                    </button>
                </div>
            </div>
            <button class="btn" id="decryptBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20L20 4" /><path d="M8 4L4 8" /><path d="M16 20L20 16" /></svg>
                <span id="decryptBtnText">立即解密</span>
            </button>
            <div class="divider" id="dividerDecrypt">解密结果</div>
            <div class="field">
                <textarea id="decryptPlain" placeholder="解密后的明文将显示在这里…" rows="3" readonly></textarea>
            </div>
            <div class="message" id="decryptMessage">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
                <span class="text" id="decryptMessageText">等待解密… 粘贴密文并输入密钥。</span>
            </div>
        </div>
    </div>

    <div class="transfer-wrapper">
        <button class="btn btn-outline" id="transferBtn" style="padding: 0.6rem 1.5rem; font-size: 0.9rem;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 10L12 15L17 10" /><path d="M12 15V3" /><path d="M5 21H19" /></svg>
            <span id="transferBtnText">将密文填入解密区</span>
        </button>
    </div>

    <div class="footer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="4" width="20" height="16" rx="4" /><path d="M22 7L12 13L2 7" /></svg>
        <span id="footerText">所有加解密均在本地完成 · 使用 Web Crypto API AES-GCM 256</span>
    </div>
</div>

<script>
    // ==================== 语言资源 ====================
    const i18n = {
        zh: {
            title: '邮件加密系统',
            subhead: '<strong>🔐 端到端本地加密</strong> — 使用 AES-256-GCM 算法，所有加解密均在浏览器中完成，密钥永不离开您的设备。',
            encryptCardTitle: '加密邮件', decryptCardTitle: '解密邮件',
            labelPlainText: '邮件正文', badgePlain: '明文', labelEncryptPassword: '加密密钥',
            labelDecryptCipher: '密文', labelDecryptPassword: '解密密钥', badgeSameKey: '同一密钥',
            encryptBtn: '立即加密', decryptBtn: '立即解密', dividerEncrypt: '加密结果', dividerDecrypt: '解密结果',
            placeholderPlain: '输入需要加密的邮件内容…', placeholderEncryptPwd: '输入密钥 (不少于8个字符)',
            placeholderCipher: '加密后的密文将显示在这里…', placeholderDecryptCipher: '粘贴需要解密的邮件密文…',
            placeholderDecryptPwd: '输入加密时使用的密钥', placeholderDecryptPlain: '解密后的明文将显示在这里…',
            encryptMessageDefault: '等待加密… 输入正文和密钥后点击加密。', decryptMessageDefault: '等待解密… 粘贴密文并输入密钥。',
            transferBtn: '将密文填入解密区', footer: '所有加解密均在本地完成 · 使用 Web Crypto API AES-GCM 256',
            emptyPlain: '❌ 邮件正文不能为空', shortPassword: '❌ 密钥必须至少8个字符', encrypting: '⏳ 正在加密…',
            encryptSuccess: '✅ 加密成功！密文已生成，可复制或一键填入解密区。', encryptFail: '❌ 加密失败: ',
            emptyCipher: '❌ 密文不能为空', emptyPassword: '❌ 请输入解密密钥', decrypting: '⏳ 正在解密…',
            decryptSuccess: '✅ 解密成功！', decryptFail: '❌ 解密失败：密钥不正确或密文损坏。',
            decryptFormatError: '❌ 密文格式无效，请检查是否完整。', decryptGenericError: '❌ 解密失败: ',
            noCipherToTransfer: '⚠️ 还没有生成密文，请先加密', transferSuccess: '📋 密文已填入，请检查密钥并点击解密。'
        },
        en: {
            title: 'Mail Encryption System',
            subhead: '<strong>🔐 End-to-end local encryption</strong> — Uses AES-256-GCM. All encryption/decryption happens in your browser. Keys never leave your device.',
            encryptCardTitle: 'Encrypt Mail', decryptCardTitle: 'Decrypt Mail',
            labelPlainText: 'Mail Body', badgePlain: 'Plaintext', labelEncryptPassword: 'Encryption Key',
            labelDecryptCipher: 'Ciphertext', labelDecryptPassword: 'Decryption Key', badgeSameKey: 'Same key',
            encryptBtn: 'Encrypt Now', decryptBtn: 'Decrypt Now', dividerEncrypt: 'Encryption Result', dividerDecrypt: 'Decryption Result',
            placeholderPlain: 'Enter the mail content to encrypt…', placeholderEncryptPwd: 'Enter key (at least 8 characters)',
            placeholderCipher: 'Encrypted ciphertext will appear here…', placeholderDecryptCipher: 'Paste the mail ciphertext to decrypt…',
            placeholderDecryptPwd: 'Enter the key used for encryption', placeholderDecryptPlain: 'Decrypted plaintext will appear here…',
            encryptMessageDefault: 'Waiting for encryption… Enter body and key, then click encrypt.', decryptMessageDefault: 'Waiting for decryption… Paste ciphertext and enter key.',
            transferBtn: 'Transfer cipher to decrypt', footer: 'All encryption/decryption done locally · Web Crypto API AES-GCM 256',
            emptyPlain: '❌ Mail body cannot be empty', shortPassword: '❌ Key must be at least 8 characters', encrypting: '⏳ Encrypting…',
            encryptSuccess: '✅ Encryption successful! Ciphertext generated. Copy or transfer to decrypt.', encryptFail: '❌ Encryption failed: ',
            emptyCipher: '❌ Ciphertext cannot be empty', emptyPassword: '❌ Please enter decryption key', decrypting: '⏳ Decrypting…',
            decryptSuccess: '✅ Decryption successful!', decryptFail: '❌ Decryption failed: wrong key or corrupted ciphertext.',
            decryptFormatError: '❌ Invalid ciphertext format. Please check completeness.', decryptGenericError: '❌ Decryption failed: ',
            noCipherToTransfer: '⚠️ No ciphertext yet. Please encrypt first.', transferSuccess: '📋 Ciphertext transferred. Check key and click decrypt.'
        }
    };

    let currentLang = 'zh';

    // ==================== 语言切换逻辑 ====================
    function applyLanguage(lang) {
        const t = i18n[lang];
        document.getElementById('titleText').textContent = t.title;
        document.getElementById('subheadText').innerHTML = t.subhead;
        document.getElementById('encryptCardTitle').textContent = t.encryptCardTitle;
        document.getElementById('decryptCardTitle').textContent = t.decryptCardTitle;
        
        document.getElementById('labelPlainText').innerHTML = `${t.labelPlainText} <span class="badge" id="badgePlain">${t.badgePlain}</span>`;
        document.getElementById('labelEncryptPassword').innerHTML = `${t.labelEncryptPassword} <span class="badge">AES-256</span>`;
        document.getElementById('labelDecryptCipher').innerHTML = `${t.labelDecryptCipher} <span class="badge">Base64 + GCM</span>`;
        document.getElementById('labelDecryptPassword').innerHTML = `${t.labelDecryptPassword} <span class="badge" id="badgeSameKey">${t.badgeSameKey}</span>`;

        document.getElementById('encryptBtnText').textContent = t.encryptBtn;
        document.getElementById('decryptBtnText').textContent = t.decryptBtn;
        document.getElementById('transferBtnText').textContent = t.transferBtn;
        document.getElementById('dividerEncrypt').textContent = t.dividerEncrypt;
        document.getElementById('dividerDecrypt').textContent = t.dividerDecrypt;

        document.getElementById('plainText').placeholder = t.placeholderPlain;
        document.getElementById('encryptPassword').placeholder = t.placeholderEncryptPwd;
        document.getElementById('cipherText').placeholder = t.placeholderCipher;
        document.getElementById('decryptCipher').placeholder = t.placeholderDecryptCipher;
        document.getElementById('decryptPassword').placeholder = t.placeholderDecryptPwd;
        document.getElementById('decryptPlain').placeholder = t.placeholderDecryptPlain;

        resetMessageText('encryptMessage', t.encryptMessageDefault);
        resetMessageText('decryptMessage', t.decryptMessageDefault);
        document.getElementById('footerText').textContent = t.footer;

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });
        currentLang = lang;
    }

    window.setLanguage = function(lang) {
        applyLanguage(lang);
    };

    // ==================== 工具函数 ====================
    window.togglePassword = function(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        } else {
            input.type = 'password';
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        }
    };

    function resetMessageText(elementId, text) {
        const el = document.getElementById(elementId);
        if (el) {
            el.querySelector('.text').textContent = text;
            el.classList.remove('error');
        }
    }

    function setMessage(elementId, text, isError = false) {
        const el = document.getElementById(elementId);
        if (el) {
            el.querySelector('.text').textContent = text;
            el.classList.toggle('error', isError);
        }
    }

    // ==================== 加解密核心 (Web Crypto API) ====================
    async function deriveKey(password, salt) {
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
        return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
            baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
        );
    }

    async function encryptMail(plaintext, password) {
        const enc = new TextEncoder();
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(password, salt);

        const ciphertextBuffer = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv: iv }, key, enc.encode(plaintext)
        );

        const ciphertext = new Uint8Array(ciphertextBuffer);
        const combined = new Uint8Array(salt.length + iv.length + ciphertext.length);
        combined.set(salt, 0);
        combined.set(iv, salt.length);
        combined.set(ciphertext, salt.length + iv.length);

        return btoa(String.fromCharCode(...combined));
    }

    async function decryptMail(encryptedBase64, password) {
        const binaryString = atob(encryptedBase64);
        const combined = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) combined[i] = binaryString.charCodeAt(i);

        if (combined.length < 16 + 12 + 1) throw new Error('invalid');
        const salt = combined.slice(0, 16);
        const iv = combined.slice(16, 28);
        const ciphertext = combined.slice(28);

        const key = await deriveKey(password, salt);
        const plaintextBuffer = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: iv }, key, ciphertext
        );
        return new TextDecoder().decode(plaintextBuffer);
    }

    // ==================== 事件监听与初始化 ====================
    document.addEventListener('DOMContentLoaded', () => {
        const plainTextArea = document.getElementById('plainText');
        const cipherTextArea = document.getElementById('cipherText');
        const decryptCipherArea = document.getElementById('decryptCipher');
        const decryptPlainArea = document.getElementById('decryptPlain');
        const encryptPassword = document.getElementById('encryptPassword');
        const decryptPassword = document.getElementById('decryptPassword');
        const encryptBtn = document.getElementById('encryptBtn');
        const decryptBtn = document.getElementById('decryptBtn');
        const transferBtn = document.getElementById('transferBtn');

        // 预设一句示例明文
        plainTextArea.value = '这是一封加密邮件，只有持有密钥的人才能阅读。';

        // 加密事件
        encryptBtn.addEventListener('click', async () => {
            const t = i18n[currentLang];
            const plaintext = plainTextArea.value.trim();
            const password = encryptPassword.value;

            if (!plaintext) return setMessage('encryptMessage', t.emptyPlain, true);
            if (!password || password.length < 8) return setMessage('encryptMessage', t.shortPassword, true);

            try {
                setMessage('encryptMessage', t.encrypting);
                const encryptedBase64 = await encryptMail(plaintext, password);
                cipherTextArea.value = encryptedBase64;
                setMessage('encryptMessage', t.encryptSuccess);
            } catch (err) {
                console.error(err);
                setMessage('encryptMessage', t.encryptFail + err.message, true);
                cipherTextArea.value = '';
            }
        });

        // 解密事件
        decryptBtn.addEventListener('click', async () => {
            const t = i18n[currentLang];
            const cipherBase64 = decryptCipherArea.value.trim();
            const password = decryptPassword.value;

            if (!cipherBase64) return setMessage('decryptMessage', t.emptyCipher, true);
            if (!password) return setMessage('decryptMessage', t.emptyPassword, true);

            try {
                setMessage('decryptMessage', t.decrypting);
                const plaintext = await decryptMail(cipherBase64, password);
                decryptPlainArea.value = plaintext;
                setMessage('decryptMessage', t.decryptSuccess);
            } catch (err) {
                console.error(err);
                let msg = t.decryptFail;
                if (err.message === 'invalid') msg = t.decryptFormatError;
                setMessage('decryptMessage', msg, true);
                decryptPlainArea.value = '';
            }
        });

        // 快捷转移按钮事件
        transferBtn.addEventListener('click', () => {
            const t = i18n[currentLang];
            const cipher = cipherTextArea.value.trim();
            if (!cipher) return setMessage('encryptMessage', t.noCipherToTransfer, true);
            
            decryptCipherArea.value = cipher;
            // 顺带把密码也带过去，方便测试
            if (!decryptPassword.value) decryptPassword.value = encryptPassword.value;
            
            decryptCipherArea.focus();
            setMessage('decryptMessage', t.transferSuccess);
        });

        // 点击结果自动全选
        cipherTextArea.addEventListener('click', function() { this.select(); });
        decryptPlainArea.addEventListener('click', function() { this.select(); });
    });
</script>
</body>
</html>
